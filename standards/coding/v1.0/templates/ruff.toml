# Project-KISS Coding Standard v1.0
target-version = "py311"
line-length = 100
indent-width = 4

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = []

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
