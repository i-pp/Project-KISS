name: Baseline CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    name: Baseline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report runtime
        run: python3 --version
      - name: Test the baseline checker
        run: python3 -B tests/test_baseline.py
      - name: Check documentation and configuration
        run: python3 -B scripts/check_baseline.py

  license:
    name: License policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify licenses with the latest released checker
        uses: i-pp/license-check-ci@f6f00d79e73562ae7d200abac986b2e9ce72252d
  minimum_ci:
    name: Minimum CI
    needs: [baseline, license]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all minimum checks to succeed
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.baseline.result }}
          LICENSE_RESULT: ${{ needs.license.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          test "$LICENSE_RESULT" = success
